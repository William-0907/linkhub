<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}LinkHub{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }

    /* Animated aurora background */
    .aurora-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      background: #020617;
    }
    .aurora-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.35;
      animation: drift 18s ease-in-out infinite alternate;
    }
    .aurora-blob-1 {
      width: 55vw; height: 55vw;
      background: radial-gradient(circle, #6366f1, transparent 70%);
      top: -15%; left: -10%;
    }
    .aurora-blob-2 {
      width: 45vw; height: 45vw;
      background: radial-gradient(circle, #a855f7, transparent 70%);
      bottom: -10%; right: -10%;
      animation-delay: -6s;
      animation-duration: 22s;
    }
    .aurora-blob-3 {
      width: 30vw; height: 30vw;
      background: radial-gradient(circle, #06b6d4, transparent 70%);
      top: 40%; left: 55%;
      animation-delay: -12s;
      animation-duration: 26s;
      opacity: 0.2;
    }
    @keyframes drift {
      0%   { transform: translate(0, 0) scale(1); }
      50%  { transform: translate(6vw, -4vh) scale(1.15); }
      100% { transform: translate(-5vw, 5vh) scale(0.95); }
    }

    /* Glass card utility */
    .glass {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-hover:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 255, 255, 0.14);
    }

    /* Gradient text */
    .gradient-text {
      background: linear-gradient(135deg, #818cf8, #c084fc, #22d3ee);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Gradient button */
    .btn-gradient {
      background: linear-gradient(135deg, #6366f1, #a855f7);
      transition: all 0.2s ease;
      box-shadow: 0 0 24px rgba(99, 102, 241, 0.35);
    }
    .btn-gradient:hover {
      box-shadow: 0 0 36px rgba(99, 102, 241, 0.55);
      transform: translateY(-1px);
    }

    /* Fade-up animation for staggered items */
    .fade-up {
      opacity: 0;
      animation: fadeUp 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Toast auto-dismiss */
    .toast { animation: toastIn 0.3s ease, toastOut 0.3s ease 3.5s forwards; }
    @keyframes toastIn  { from { opacity: 0; transform: translateY(-12px); } }
    @keyframes toastOut { to   { opacity: 0; transform: translateY(-12px); } }

    .drag-over { border-color: rgb(129 140 248) !important; background-color: rgba(99, 102, 241, 0.08) !important; }
    .dragging { opacity: 0.35; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body class="text-slate-100 min-h-screen antialiased">
  <div class="aurora-bg">
    <div class="aurora-blob aurora-blob-1"></div>
    <div class="aurora-blob aurora-blob-2"></div>
    <div class="aurora-blob aurora-blob-3"></div>
  </div>

  {% if messages %}
  <div class="fixed top-4 left-1/2 -translate-x-1/2 z-50 space-y-2 w-full max-w-md px-4">
    {% for message in messages %}
    <div class="toast glass rounded-2xl px-4 py-3 text-sm font-medium shadow-xl
      {% if message.tags == 'success' %}text-emerald-300 border-emerald-500/30
      {% elif message.tags == 'error' %}text-red-300 border-red-500/30
      {% else %}text-slate-200{% endif %}">
      {{ message }}
    </div>
    {% endfor %}
  </div>
  {% endif %}

  {% block content %}{% endblock %}

</body>
</html>
